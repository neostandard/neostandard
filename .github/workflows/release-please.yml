name: Release Please

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      release-channel:
        description: 'Choose a regular release or a prerelease'
        required: true
        default: stable
        type: choice
        options:
          - stable
          - prerelease
      prerelease-type:
        description: 'Prerelease identifier'
        required: true
        default: next
        type: choice
        options:
          - next
      release-as:
        description: 'Exact version to release (use 0.14.0 to promote the current prerelease to stable)'
        required: false
        type: string
      force-release:
        description: 'Force release to npm'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release_please:
    name: release-please
    runs-on: ubuntu-latest
    if: github.repository == 'neostandard/neostandard'
    outputs:
      releaseCreated: ${{ steps.release.outputs.release_created }}
      tagName: ${{ steps.release.outputs.tag_name }}
    environment: sync
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          show-progress: false

      # Generate bot token
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}

      - name: Retrieve GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Select release config
        id: release-config
        env:
          RELEASE_CHANNEL: ${{ inputs.release-channel || '' }}
        run: bash .github/scripts/configure-release-please-config.sh

      # Release please
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: ${{ steps.release-config.outputs.config_file }}
          manifest-file: .github/release-please/manifest.json
          release-as: ${{ inputs.release-as || '' }}
          token: ${{ steps.app-token.outputs.token }}

  npm_publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    needs: release_please
    if: needs.release_please.outputs.releaseCreated || inputs.force-release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts --force --no-fund --no-audit

      - name: Publish to npm
        env:
          NPM_TAG: ${{ needs.release_please.outputs.tagName != '' && contains(needs.release_please.outputs.tagName, '-') && 'next' || inputs.release-channel == 'prerelease' && 'next' || 'latest' }}
        run: npm publish --provenance --access public --tag="$NPM_TAG"
