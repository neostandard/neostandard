name: Release Please

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      release-channel:
        description: 'Choose a regular release or a prerelease'
        required: true
        default: stable
        type: choice
        options:
          - stable
          - prerelease
      prerelease-type:
        description: 'Prerelease identifier'
        required: true
        default: next
        type: choice
        options:
          - next
      npm-tag:
        description: 'npm dist-tag to publish under'
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
      force-release:
        description: 'Force release to npm'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release_please:
    name: release-please
    runs-on: ubuntu-latest
    if: github.repository == 'neostandard/neostandard'
    outputs:
      releaseCreated: ${{ steps.release.outputs.release_created }}
    environment: sync
    steps:
      # Generate bot token
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}

      - name: Retrieve GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure release channel
        env:
          RELEASE_PRERELEASE: ${{ inputs.release-channel == 'prerelease' }}
          RELEASE_PRERELEASE_TYPE: ${{ inputs.prerelease-type || 'next' }}
        run: |
          jq --argjson prerelease "$RELEASE_PRERELEASE" \
            --arg prerelease_type "$RELEASE_PRERELEASE_TYPE" \
            'if $prerelease then
               .prerelease = true | .["prerelease-type"] = $prerelease_type | .versioning = "prerelease"
             else
               del(.prerelease, .["prerelease-type"], .versioning)
             end' \
            .github/release-please/config.json > .github/release-please/config.generated.json

      # Release please
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please/config.generated.json
          manifest-file: .github/release-please/manifest.json
          token: ${{ steps.app-token.outputs.token }}

  npm_publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    needs: release_please
    if: needs.release_please.outputs.releaseCreated || inputs.force-release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts --force --no-fund --no-audit

      - name: Publish to npm
        env:
          NPM_TAG: ${{ inputs.npm-tag || 'latest' }}
        run: npm publish --provenance --access public --tag="$NPM_TAG"
