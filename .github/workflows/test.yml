name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '14 5 * * 1,3,5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref == 'main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/reusable-npm-run.yml
    with:
      command: check

  test:
    strategy:
      fail-fast: false
      matrix:
        target: [22, 24, 26]
    name: Test on Node ${{ matrix.target }}
    uses: ./.github/workflows/reusable-npm-run.yml
    with:
      command: test-ci
      node-version: ${{ matrix.target }}

  # The Node matrix above runs against eslint 10 (the lockfile). Cover the peer
  # floor (eslint 9.22, where eslint/config defineConfig landed) so the lower end
  # of `^9.22.0 || ^10` stays green.
  test-eslint9:
    name: Test on ESLint 9.22
    uses: ./.github/workflows/reusable-npm-run.yml
    with:
      command: test-ci
      eslint-version: '9.22'

  peer:
    needs: [lint, test, test-eslint9]
    if: github.event_name != 'schedule'
    name: Check peerDependencies issues
    uses: ./.github/workflows/reusable-npm-run.yml
    with:
      command: check-peer-compatibility

  canary:
    needs: [lint, test]
    uses: ./.github/workflows/canary.yml

  compatibility:
    needs: [canary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - moduleSet: semistandard
            flags: --semi
          - moduleSet: standard
          - moduleSet: ts-standard
            flags: --ts
    uses: ./.github/workflows/compatibility.yml
    with:
      moduleSet: ${{ matrix.moduleSet }}
      flags: ${{ matrix.flags }}
